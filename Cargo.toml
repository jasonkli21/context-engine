[package]
name = "context-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first codebase and context intelligence engine"
readme = "README.md"
keywords = ["code-intelligence", "developer-tools", "context", "rust"]
categories = ["development-tools"]
publish = false

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
