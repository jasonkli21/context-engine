[package]
name = "context-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local-first codebase and context intelligence engine"
readme = "README.md"
keywords = ["code-intelligence", "developer-tools", "context", "rust"]
categories = ["development-tools"]
publish = false

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
rusqlite = { version = "0.38", features = ["bundled", "limits"] }
blake3 = "1"
dirs = "6"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
notify = "8"

tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "io-std", "io-util", "macros"] }
axum = "0.8"
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-child-process"] }
